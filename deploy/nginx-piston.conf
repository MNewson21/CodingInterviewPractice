# Reverse proxy that puts a gatekeeper in front of the self-hosted Piston box.
# For my project this just ensures more cyber security 
#
# The browser calls Piston directly, so without this the execution API (which runs
# arbitrary user code) is wide open on the internet. This proxy adds, per source IP:
#   - rate limiting (sustained + burst)
#   - a small request-body cap
#   - a path allowlist (only the two endpoints the app actually uses)
#   - CORS locked to the app's own origin
#   - TLS termination (fill in your certs)
#
# Piston itself should listen only on localhost:2000 (NOT 0.0.0.0) and the AWS
# security group should expose ONLY 443 to the world — never 2000. See
# docs/PISTON_SETUP.md for the matching server-side limits and security-group rules.

# --- Rate-limit zones (keyed by client IP) -----------------------------------
# 5 req/s sustained with a small burst soaks normal "Run" clicks while stopping a
# script from hammering the executor. 10m of shared memory tracks ~160k IPs.
# didnt want my api key getting rinsed and letting others use it up so others couldnt use the ai features
limit_req_zone  $binary_remote_addr  zone=piston_exec:10m  rate=5r/s;
# Cap simultaneous in-flight executions per IP so one client can't pin every worker.
limit_conn_zone $binary_remote_addr  zone=piston_conn:10m;

# Allow only the app's origin to call the API from a browser. Override at deploy time.
map $http_origin $piston_cors_origin {
  default                              "";
  "https://codinginterviewpractice.dev"  $http_origin;
  "https://www.codinginterviewpractice.dev"  $http_origin;
}

server {
  listen 443 ssl http2;
  server_name piston.codinginterviewpractice.dev;  # <-- your Piston subdomain

  # TLS — point these at your real certificate (e.g. from certbot/Let's Encrypt).
  ssl_certificate     /etc/letsencrypt/live/piston.codinginterviewpractice.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/piston.codinginterviewpractice.dev/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # User code is tiny; reject anything that smells like an upload/abuse attempt.
  client_max_body_size 64k;

  # Hard ceilings on how long a proxied request may take (defence-in-depth on top
  # of Piston's own run/compile timeouts).
  proxy_connect_timeout 5s;
  proxy_send_timeout    15s;
  proxy_read_timeout    15s;

  # CORS — answer preflight and echo the allowed origin (empty => browser blocks it).
  add_header Access-Control-Allow-Origin  $piston_cors_origin always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "content-type" always;
  add_header Vary Origin always;

  # Default: refuse everything not explicitly allowed below.
  location / {
    return 404;
  }

  # The only two endpoints the app uses: list runtimes + execute code.
  location = /api/v2/runtimes {
    if ($request_method = OPTIONS) { return 204; }
    limit_req  zone=piston_exec burst=10 nodelay;
    proxy_pass http://127.0.0.1:2000;
  }

  location = /api/v2/execute {
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
    limit_req   zone=piston_exec burst=10 nodelay;
    limit_conn  piston_conn 4;          # max 4 concurrent executions per IP
    limit_req_status  429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:2000;
  }
}

# Redirect plain HTTP to HTTPS so the box never serves the API in the clear.
server {
  listen 80;
  server_name piston.codinginterviewpractice.dev;
  return 301 https://$host$request_uri;
}
